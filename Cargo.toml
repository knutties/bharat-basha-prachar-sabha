[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/auth-service",
    "crates/curriculum-service",
    "crates/assessment-service",
    "crates/content-service",
    "crates/live-class-service",
    "crates/notification-service",
    "crates/payment-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/knutties/bharat-basha-prachar-sabha"

[workspace.dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
diesel = { version = "2", features = ["postgres", "uuid", "chrono", "r2d2"] }
diesel_migrations = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
validator = { version = "0.18", features = ["derive"] }

# Testing
mockall = "0.12"

# Shared crate
shared = { path = "crates/shared" }
